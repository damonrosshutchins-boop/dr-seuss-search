<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Hollow Knight: Silksong · Dr. Seuss Search</title>
  <base href="https://raw.githubusercontent.com/web-ports/hollow-knight-silksong/master/">
  <link rel="icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">
  <style>
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:#080b12; color:#f5f5f5; font:600 14px system-ui,sans-serif; }
    #loading-text { position:fixed; z-index:5; top:14px; left:12px; right:12px; text-align:center; line-height:1.45; color:#f5f5f5; }
    #unity-container { position:absolute; inset:52px 0 0; display:grid; place-items:center; padding:12px; }
    #unity-canvas { display:block; width:min(100%, 1200px); max-height:calc(100vh - 80px); height:auto; aspect-ratio:8/5; background:#111; outline:none; }
    #unity-loading-bar { display:none; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:min(340px,80vw); }
    #unity-logo { min-height:42px; }
    #unity-progress-bar-empty { height:12px; padding:2px; border:1px solid #d4d4d4; border-radius:20px; background:#242424; }
    #unity-progress-bar-full { width:0%; height:100%; border-radius:20px; background:#d5b36b; transition:width .12s linear; }
    #unity-warning { position:absolute; left:12px; right:12px; bottom:12px; max-width:900px; margin:auto; color:#fff; }
    .hint { position:fixed; left:12px; right:12px; bottom:8px; color:#aab2bf; text-align:center; font-size:12px; pointer-events:none; }
    @media (max-width:650px) { #loading-text { font-size:12px; } #unity-container { inset:60px 0 0; padding:4px; } }
  </style>
  <script src="jszip.js"></script>
</head>
<body>
  <div id="loading-text" role="status" aria-live="polite">Preparing Hollow Knight: Silksong…</div>
  <div id="unity-container">
    <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>
    <div id="unity-loading-bar">
      <div id="unity-logo"></div>
      <div id="unity-progress-bar-empty"><div id="unity-progress-bar-full"></div></div>
    </div>
    <div id="unity-warning"></div>
  </div>
  <p class="hint">Click the game to focus the keyboard. First launch downloads about 2 GB; later launches use the saved browser cache.</p>

  <script>
  (() => {
    "use strict";

    const ASSET_BASE = new URL(document.querySelector("base").href);
    const CACHE_NAME = "dss-silksong-assets-v4";
    const CACHE_BASE = new URL("/dr-seuss-search/__silksong_cache__/", location.origin);
    const CACHE_COMPLETE_KEY = new URL("__complete__", CACHE_BASE).href;
    const EXPECTED_MB = 1986.64;
    const originalFetch = window.fetch.bind(window);
    const loadingText = document.getElementById("loading-text");
    const progressBar = document.getElementById("unity-progress-bar-full");

    const ASSET_MIRRORS = [
      ASSET_BASE,
      new URL("https://cdn.jsdelivr.net/gh/web-ports/hollow-knight-silksong@master/")
    ];

    function assetLocation(resource) {
      let url;
      try {
        const raw = resource instanceof Request ? resource.url : String(resource);
        url = new URL(raw, document.baseURI);
      } catch {
        return null;
      }
      for (const base of ASSET_MIRRORS) {
        if (url.origin === base.origin && url.pathname.startsWith(base.pathname)) {
          const relative = url.pathname.slice(base.pathname.length);
          if (!relative || relative.split("/").includes("..")) return null;
          return { relative, search: url.search };
        }
      }
      return null;
    }

    function assetCacheKey(resource) {
      const location = assetLocation(resource);
      if (!location) return null;
      let safePath;
      try {
        safePath = location.relative.split("/").map(part =>
          encodeURIComponent(decodeURIComponent(part))
        ).join("/");
      } catch {
        return null;
      }
      return new URL(safePath + location.search, CACHE_BASE).href;
    }

    async function fetchAssetFromMirrors(resource, options) {
      const location = assetLocation(resource);
      if (!location) return originalFetch(resource, options);

      const failures = [];
      for (const mirror of ASSET_MIRRORS) {
        const target = new URL(location.relative + location.search, mirror).href;
        try {
          const request = resource instanceof Request
            ? new Request(target, resource)
            : target;
          const response = await originalFetch(request, options);
          if (response.ok) return response;
          failures.push(mirror.hostname + " returned HTTP " + response.status);
        } catch (error) {
          failures.push(mirror.hostname + ": " + String(error && error.message || error));
        }
      }
      throw new Error("Both game asset mirrors failed for " + location.relative + ". " + failures.join(" · "));
    }

    // Prefer raw GitHub and fall back to jsDelivr if a CDN request fails.
    // Keep the full ZIP-relative asset path consistent with the cache keys.
    window.fetch = async function(resource, options) {
      const key = assetCacheKey(resource);
      if (key) {
        try {
          const cache = await caches.open(CACHE_NAME);
          const saved = await cache.match(key);
          if (saved) return saved;
        } catch (error) {
          console.warn("Silksong cache lookup failed; using the network.", error);
        }
      }
      return fetchAssetFromMirrors(resource, options);
    };

    function setStatus(message) {
      loadingText.textContent = message;
    }
    function formatMB(bytes) {
      return (bytes / (1024 * 1024)).toFixed(1);
    }
    async function removeOldCaches() {
      const names = await caches.keys();
      await Promise.all(names
        .filter(name => name.startsWith("dss-silksong-assets-") && name !== CACHE_NAME)
        .map(name => caches.delete(name)));
    }
    async function downloadZipParts() {
      const blobs = [];
      let received = 0;
      for (let part = 1; part <= 100; part++) {
        const url = new URL("StreamingAssets/aa/WebGL.zip.part" + part, ASSET_BASE);
        setStatus("Downloading game assets… part " + part + " / 100 · " + formatMB(received) + " MB / " + EXPECTED_MB + " MB");
        let blob = null;
        let lastError = null;
        for (let attempt = 1; attempt <= 2 && !blob; attempt++) {
          try {
            const response = await fetchAssetFromMirrors(url.href);
            blob = await response.blob();
            if (!blob.size) throw new Error("The server returned an empty file.");
          } catch (error) {
            lastError = error;
            if (attempt < 2) {
              setStatus("Retrying asset part " + part + "…");
              await new Promise(resolve => setTimeout(resolve, 900));
            }
          }
        }
        if (!blob) {
          throw new Error(
            "Could not download asset part " + part + " of 100. " +
            String(lastError && lastError.message || lastError || "Unknown network error") +
            " Check the connection and reload to retry."
          );
        }
        blobs.push(blob);
        received += blob.size;
        setStatus("Downloaded " + formatMB(received) + " MB / " + EXPECTED_MB + " MB of game assets…");
      }
      return new Blob(blobs, { type: "application/zip" });
    }
    function contentTypeFor(name) {
      if (/\.wasm(?:\.unityweb)?$/i.test(name)) return "application/wasm";
      if (/\.js(?:\.unityweb)?$/i.test(name)) return "application/javascript";
      if (/\.json$/i.test(name)) return "application/json";
      if (/\.png$/i.test(name)) return "image/png";
      if (/\.jpe?g$/i.test(name)) return "image/jpeg";
      if (/\.webp$/i.test(name)) return "image/webp";
      return "application/octet-stream";
    }
    async function extractAssets(zipBlob) {
      if (!window.JSZip) throw new Error("The ZIP library did not load. Reload the page to retry.");
      setStatus("Extracting game assets… this can take a while.");
      const zip = await JSZip.loadAsync(zipBlob);
      const files = Object.values(zip.files).filter(file => !file.dir);
      const cache = await caches.open(CACHE_NAME);
      let completed = 0;
      const batchSize = 6;

      for (let offset = 0; offset < files.length; offset += batchSize) {
        const batch = files.slice(offset, offset + batchSize);
        await Promise.all(batch.map(async file => {
          const assetUrl = new URL(file.name, ASSET_BASE);
          const key = assetCacheKey(assetUrl.href);
          if (!key) throw new Error("The ZIP contained an unexpected asset path: " + file.name);
          const blob = await file.async("blob");
          await cache.put(key, new Response(blob, {
            headers: { "Content-Type": contentTypeFor(file.name) }
          }));
          completed++;
        }));
        setStatus("Extracting game assets… " + completed + " / " + files.length + " files");
        await new Promise(resolve => setTimeout(resolve, 0));
      }

      await cache.put(CACHE_COMPLETE_KEY, new Response("ok"));
    }
    async function isAssetsCached() {
      const cache = await caches.open(CACHE_NAME);
      return !!(await cache.match(CACHE_COMPLETE_KEY));
    }

    function showUnityBanner(message, type) {
      const target = document.getElementById("unity-warning");
      const item = document.createElement("div");
      item.textContent = message;
      item.style.cssText = "padding:10px;margin-top:8px;border-radius:6px;background:" + (type === "error" ? "#a21d2b" : "#8a6a1f") + ";";
      target.appendChild(item);
      if (type !== "error") setTimeout(() => item.remove(), 6000);
    }
    function startUnity() {
      const canvas = document.getElementById("unity-canvas");
      const loadingBar = document.getElementById("unity-loading-bar");
      loadingBar.style.display = "block";
      setStatus("Starting the game engine…");

      const loader = document.createElement("script");
      const loaderUrls = ASSET_MIRRORS.map(base => new URL("Build/w-pt.loader.js", base).href);
      let loaderAttempt = 0;
      loader.onerror = () => {
        loaderAttempt++;
        if (loaderAttempt < loaderUrls.length) {
          loader.src = loaderUrls[loaderAttempt];
        } else {
          setStatus("The Unity loader could not be downloaded from either game file host. Check the connection and reload.");
        }
      };
      loader.src = loaderUrls[0];
      loader.onload = () => {
        if (typeof createUnityInstance !== "function") {
          setStatus("The game engine did not initialize. Reload the page to retry.");
          return;
        }
        const config = {
          dataUrl: new URL("Build/w-pt.data.unityweb", ASSET_BASE).href,
          frameworkUrl: new URL("Build/w-pt.framework.js.unityweb", ASSET_BASE).href,
          codeUrl: new URL("Build/w-pt.wasm.unityweb", ASSET_BASE).href,
          streamingAssetsUrl: new URL("StreamingAssets", ASSET_BASE).href,
          companyName: "EDUrocks Group, Truffled, GN-Math",
          productName: "Hollow Knight SilkSong",
          productVersion: "1.0",
          showBanner: showUnityBanner
        };
        createUnityInstance(canvas, config, progress => {
          progressBar.style.width = (progress * 100) + "%";
          setStatus("Starting game… " + Math.round(progress * 100) + "%");
        }).then(() => {
          loadingBar.remove();
          loadingText.remove();
          document.querySelector(".hint").remove();
          canvas.focus();
        }).catch(error => {
          console.error(error);
          setStatus("The game could not start: " + String(error && error.message || error));
        });
      };
      loader.onerror = () => setStatus("The Unity loader could not be downloaded. Check the connection and reload.");
      document.body.appendChild(loader);
    }

    async function main() {
      try {
        await removeOldCaches();
        if (!(await isAssetsCached())) {
          const available = navigator.storage && navigator.storage.estimate
            ? await navigator.storage.estimate().catch(() => null)
            : null;
          if (available && available.quota && available.quota - (available.usage || 0) < 500 * 1024 * 1024) {
            setStatus("Your browser reports less than 500 MB of free site storage. Free some browser storage before starting this game.");
            return;
          }
          setStatus("First launch: downloading about 2 GB of game assets. Keep this tab open.");
          const zip = await downloadZipParts();
          await extractAssets(zip);
        } else {
          setStatus("Game assets found in browser cache. Loading…");
        }
        startUnity();
      } catch (error) {
        console.error(error);
        setStatus("Could not load the game: " + String(error && error.message || error));
      }
    }

    main();
  })();
  </script>
</body>
</html>
