name: Build standalone sm64js and Numera browser apps

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-browser-tools.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seuss-browser-tools
  cancel-in-progress: false

jobs:
  vendor-apps:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Fetch pinned, publicly licensed upstream sources
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch vanilla https://github.com/sm64js/sm64js.git /tmp/seuss-sm64js
          git -C /tmp/seuss-sm64js fetch --quiet --depth 1 origin 04c1a984117ebb8d0e7b0d5d2e3424367f69b92d
          git -C /tmp/seuss-sm64js checkout --quiet --detach 04c1a984117ebb8d0e7b0d5d2e3424367f69b92d
          test "$(git -C /tmp/seuss-sm64js rev-parse HEAD)" = 04c1a984117ebb8d0e7b0d5d2e3424367f69b92d
          git clone --quiet --depth 1 --branch main https://github.com/daverayment/Numera.git /tmp/seuss-numera
          git -C /tmp/seuss-numera fetch --quiet --depth 1 origin 74e8db6cea6d6d759a26372ab7272317e24470a3
          git -C /tmp/seuss-numera checkout --quiet --detach 74e8db6cea6d6d759a26372ab7272317e24470a3
          test "$(git -C /tmp/seuss-numera rev-parse HEAD)" = 74e8db6cea6d6d759a26372ab7272317e24470a3
      - name: Build sm64js as local JavaScript (no iframe or bundled ROM)
        shell: bash
        env:
          NODE_OPTIONS: --openssl-legacy-provider --max-old-space-size=4096
        run: |
          set -euo pipefail
          cd /tmp/seuss-sm64js
          node - <<'NODE'
          const fs=require('fs');
          let content=fs.readFileSync('webpack.config.js','utf8');
          const needle='publicPath: "/"';
          if(!content.includes(needle))throw new Error('sm64js webpack output setting changed');
          content=content.replace(needle,'publicPath: "./"');
          fs.writeFileSync('webpack.config.js',content);
          NODE
          npm install --legacy-peer-deps --no-audit --no-fund
          npm run build
          test -s dist/index.html
          mkdir -p "$GITHUB_WORKSPACE/games/sm64js"
          cp -a dist/. "$GITHUB_WORKSPACE/games/sm64js/"
          cp LICENSE "$GITHUB_WORKSPACE/games/sm64js/SM64JS-LICENSE.txt"
          node - "$GITHUB_WORKSPACE/games/sm64js/index.html" <<'NODE'
          const fs=require('fs');
          const file=process.argv[2];
          let content=fs.readFileSync(file,'utf8');
          if(!/<body\b/i.test(content))throw new Error('No sm64js HTML body');
          const banner='<nav style="padding:10px;background:#17152a;color:white;text-align:center"><a href="../../" style="color:#adf0ff;font-weight:bold">← Back to Seuss Search</a> · sm64js JavaScript/WebGL port. Requires your own legally obtained US N64 game file; none is distributed here.</nav>';
          content=content.replace(/<body([^>]*)>/i,(m)=>m+banner);
          fs.writeFileSync(file,content);
          NODE
          if find "$GITHUB_WORKSPACE/games/sm64js" -type f \( -iname '*.z64' -o -iname '*.n64' -o -iname '*.v64' \) | grep -q .; then
            echo "Unexpected ROM in built output" >&2; exit 1
          fi
          du -sh "$GITHUB_WORKSPACE/games/sm64js"
      - name: Build actual Numera C# evaluator as browser WebAssembly
        shell: bash
        run: |
          set -euo pipefail
          dotnet new blazorwasm --framework net10.0 -n SeussNumera -o /tmp/seuss-numera-web --no-restore
          dotnet add /tmp/seuss-numera-web/SeussNumera.csproj reference /tmp/seuss-numera/Numera/Numera.csproj
          cat > /tmp/seuss-numera-web/Pages/Home.razor <<'RAZOR'
          @page "/"
          @using Numera
          <PageTitle>Numera Math | Seuss Search</PageTitle>
          <main class="numera-shell">
            <header><a href="../../">← Back to Seuss Search</a><span>Powered by the Numera .NET 10 evaluator</span></header>
            <section class="numera-card">
              <p class="eyebrow">MATH LAB · BROWSER WEBASSEMBLY</p>
              <h1>Numera</h1>
              <p class="description">Exact integers, decimals, fractions, functions and scientific calculations. Everything evaluates in your browser using the original C# Numera library.</p>
              <label for="expression">Expression</label>
              <textarea id="expression" rows="3" maxlength="500" @bind="expression" @bind:event="oninput" placeholder="Try 1/3 + 0.5"></textarea>
              <div class="actions">
                <button class="calculate" @onclick="Evaluate">Evaluate</button>
                <button @onclick="Clear">Clear</button>
              </div>
              <output aria-live="polite"><span>Result</span><strong>@resultText</strong><small>@detail</small></output>
              <p class="examples">Try: 2^100 · (1/3)*3 · sqrt(144) · 200 + 15% · gcd(24, 36, 60)</p>
              <p class="attribution"><a href="https://github.com/daverayment/Numera" target="_blank" rel="noopener noreferrer">Numera source (MIT)</a> · No server math evaluation</p>
            </section>
          </main>
          @code {
              private string expression = "3033554.11 - 3033359.71";
              private string resultText = "Enter an expression and choose Evaluate";
              private string detail = "";
              private void Evaluate()
              {
                  try
                  {
                      if (!Calculator.TryEvaluate(expression, out var output, out var diagnostic))
                      {
                          resultText = "Unable to evaluate";
                          detail = $"{diagnostic.Code}: {diagnostic.Message}";
                          return;
                      }
                      var card = Calculator.FormatResult(output);
                      resultText = card.PrimaryDisplay;
                      detail = output.Type.ToString();
                  }
                  catch (Exception error)
                  {
                      resultText = "Unable to evaluate";
                      detail = error.Message;
                  }
              }
              private void Clear()
              {
                  expression = "";
                  resultText = "Enter an expression and choose Evaluate";
                  detail = "";
              }
          }
          RAZOR
          cat > /tmp/seuss-numera-web/wwwroot/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <base href="./" />
            <title>Numera Math | Seuss Search</title>
            <style>
              *{box-sizing:border-box}body{margin:0;background:linear-gradient(150deg,#e9e4fe,#f7f5fc 45%,#dbeafa);color:#282047;font:16px system-ui,sans-serif;min-height:100vh}
              .numera-shell{max-width:780px;margin:auto;padding:20px}
              .numera-shell header{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;align-items:center;padding:18px 0;color:#50446e;font-size:13px}
              a{color:#5433bb}.numera-card{border:1px solid #d3c7f2;background:#fff;border-radius:26px;padding:clamp(20px,5vw,44px);box-shadow:0 18px 55px #35247018}
              h1{font-size:clamp(36px,7vw,58px);margin:0 0 10px}.eyebrow{font-size:12px;letter-spacing:.14em;font-weight:900;color:#7c56c5}.description{line-height:1.6;color:#625a7a}
              label{display:block;font-weight:800;margin:26px 0 10px}textarea{display:block;width:100%;padding:16px;border:2px solid #bba8e5;border-radius:16px;resize:vertical;min-height:88px;font:18px ui-monospace,monospace;background:#fdfaff;color:#252039}
              textarea:focus-visible{outline:3px solid #8e6bdf}.actions{display:flex;gap:12px;margin:17px 0 24px;flex-wrap:wrap}
              button{cursor:pointer;border:1px solid #bba8e5;border-radius:14px;padding:12px 24px;background:white;color:#412771;font-weight:800}
              .calculate{color:white;background:#6f47bd;border-color:#6f47bd}button:focus-visible{outline:3px solid #b590ff}
              output{display:grid;gap:8px;padding:21px;border-radius:18px;background:#f5f0ff;overflow-wrap:anywhere}
              output span{font-size:13px;color:#726388}output strong{font-size:clamp(21px,4vw,31px);color:#3e277a}
              output small{color:#5d5271}.examples,.attribution{color:#716780;font-size:13px;line-height:1.6}
            </style>
          </head>
          <body>
            <div id="app"><p style="padding:32px;text-align:center">Loading local Numera mathematics engine…</p></div>
            <script src="_framework/blazor.webassembly.js"></script>
          </body>
          </html>
          HTML
          dotnet publish /tmp/seuss-numera-web/SeussNumera.csproj --configuration Release --output /tmp/seuss-numera-publish
          test -s /tmp/seuss-numera-publish/wwwroot/index.html
          mkdir -p "$GITHUB_WORKSPACE/math/numera"
          cp -a /tmp/seuss-numera-publish/wwwroot/. "$GITHUB_WORKSPACE/math/numera/"
          cp /tmp/seuss-numera/LICENSE "$GITHUB_WORKSPACE/math/numera/NUMERA-LICENSE.txt"
          test -f "$GITHUB_WORKSPACE/math/numera/_framework/blazor.webassembly.js"
          du -sh "$GITHUB_WORKSPACE/math/numera"
      - name: Commit pinned, built apps
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -A -- games/sm64js math/numera
          if git diff --cached --quiet; then
            echo "No updated assets"
          else
            git commit -m "Vendor standalone sm64js and Numera WebAssembly apps"
            git push origin HEAD:main
          fi
