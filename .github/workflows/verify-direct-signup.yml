name: Test direct Supabase Auth signup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-direct-signup.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Sign up and log in with a temporary autogenerated account
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import urllib.request, urllib.error, json, secrets
          root = "https://cihzaevtdoquseoxxdqf.supabase.co"
          public = "sb_publishable_TKOD-qL58VJU9c4R952W_w_Tw7qbqgL"
          username = "dsscheck" + secrets.token_hex(6)
          email = username + "@login.seuss.invalid"
          password = "SmokeTest!" + secrets.token_urlsafe(18)
          def post(url, data):
              req = urllib.request.Request(
                  root + url,
                  data=json.dumps(data).encode("utf-8"),
                  headers={"apikey": public, "Content-Type": "application/json"},
                  method="POST"
              )
              try:
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      return resp.status, json.load(resp)
              except urllib.error.HTTPError as error:
                  try: message = json.loads(error.read())
                  except: message = {"error": "HTTP " + str(error.code)}
                  return error.code, message
          status, response = post("/auth/v1/signup", {"email": email, "password": password})
          print("Test username:", username)
          print("Signup status:", status)
          print("Signup user confirmed:", bool(response.get("user", {}).get("email_confirmed_at")))
          print("Signup returned session:", bool(response.get("access_token")))
          if status not in (200, 201) or not response.get("access_token"):
              print("Signup error:", response.get("msg") or response.get("message") or response.get("error") or response.get("code"))
              raise SystemExit("Direct signup did not return a signed-in session")
          second_status, second = post("/auth/v1/token?grant_type=password", {"email": email, "password": password})
          print("Login status:", second_status)
          print("Login returned session:", bool(second.get("access_token")))
          if second_status != 200 or not second.get("access_token"):
              print("Login error:", second.get("msg") or second.get("message") or second.get("error"))
              raise SystemExit("Login failed after direct signup")
          print("PASS: Direct Supabase Auth signup and password login worked")
          PY
