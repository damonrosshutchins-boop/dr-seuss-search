name: Hosting smoke tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  hosting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check sw.js
          node --check app.js
          node --check identity-admin.js
      - name: Test both hosting paths
        run: node --test tests/hosting-smoke.test.mjs
